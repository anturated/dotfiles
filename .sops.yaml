creation_rules:
  # personal secrets
  - path_regex: secrets/desant\.yaml
    key_groups:
      - age:
          - *desant

  # service secrets
  - path_regex: secrets/services/[^/]+\.(yaml|json|env|ini)$
    key_groups:
      - age:
          - *desant
          - *legion
          - *cynnil
