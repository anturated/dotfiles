when:
  - event: cron
    cron: iso

# TODO: try parallel html connections here and in check... and update

clone:
  - name: clone
    image: woodpeckerci/plugin-git
    settings:
      username: caterpillar-bot
      password:
        from_secret: PILL_TOKEN

steps:
  - name: build
    image: nixos/nix
    commands:
      - export NIX_CONFIG="extra-experimental-features = nix-command flakes"
      - nix build -L .#nixosConfigurations.saeth.config.system.build.isoImage
      # nix store gets nuked
      - cp ./result/iso/*.iso ./

  - name: cleanup
    depends_on: [build]
    image: alpine
    environment:
      CDN_PASS:
        from_secret: CDN_PASS
    commands:
      - apk add curl jq
      - |
        CDN_TOKEN=$(curl -X PUT -s "https://burger.anturated.dev/~/api/auth" \
          -F "login=builder" \
          -F "password=$${CDN_PASS}" | jq -r '.data.token')
      # this is horrid but i'm sleep deprived enough at this point
      # delete all but 2 last ISOs
      - |
        curl -s -X GET "https://burger.anturated.dev/~/api/directory?path=/ceirios-builds" \
          --header "Authorization: Bearer $${CDN_TOKEN}" \
          | jq -r '[.data[] | select(.isDirectory == false)] | sort_by(.birthtime) | reverse | .[2:] | .[].path' \
          | while read path; do
              echo "deleting $path"
              curl -s -X DELETE "https://burger.anturated.dev/~/api/file?path=$(echo $path | sed 's|/|%2F|g')" \
                --header "Authorization: Bearer $${CDN_TOKEN}"
            done

  - name: upload
    depends_on: [cleanup]
    image: alpine
    environment:
      CDN_PASS:
        from_secret: CDN_PASS
      FORGEJO_TOKEN:
        from_secret: PILL_TOKEN
    commands:
      # set up
      - apk add curl jq
      # get iso data
      - ISO=$(ls *.iso | head -1)
      - UPLOAD_PATH="/ceirios-builds/$${ISO}"
      # get cdn token
      - |
        CDN_TOKEN=$(curl -X PUT -s "https://burger.anturated.dev/~/api/auth" \
        -F "login=builder" \
        -F "password=$${CDN_PASS}" | jq -r '.data.token')
      # upload
      - |
        curl -X PUT "https://burger.anturated.dev/~/api/file" \
        --header "Authorization: Bearer $${CDN_TOKEN}" \
        --data-binary "@$${ISO}" \
        --url-query "path=$${UPLOAD_PATH}"
      # get permalink
      - |
        LINK_RESPONSE=$(curl -X GET -s "https://burger.anturated.dev/~/api/link" \
        --header "Authorization: Bearer $${CDN_TOKEN}" \
        --url-query "path=$${UPLOAD_PATH}")
      - URL=$(echo "$${LINK_RESPONSE}" | jq -r '.data.url')
      # persist
      - echo $URL > ./url

  - name: release
    depends_on: [upload]
    image: alpine
    environment:
      FORGEJO_TOKEN:
        from_secret: PILL_TOKEN
    commands:
      # setup
      - apk add curl jq
      - URL=$(cat ./url)
      - ISO=$(ls *.iso | head -1)
      - SHORT_SHA=$(echo ${CI_COMMIT_SHA} | cut -c1-7)
      # release
      - |
        RELEASE=$(curl -s -X POST https://git.anturated.dev/api/v1/repos/${CI_REPO}/releases \
          -H "Authorization: token $${FORGEJO_TOKEN}" \
          -H "Content-Type: application/json" \
          -d "{
            \"tag_name\": \"ceirios-$${SHORT_SHA}\",
            \"body\": \"Only 3 isos stay alive at the same time, the rest gets nuked.\",
            \"target_commitish\": \"${CI_COMMIT_SHA}\"
          }")
      # grab id
      - RELEASE_ID=$(echo $RELEASE | jq -r '.id')
      # add iso
      - |
        curl -s -X POST "https://git.anturated.dev/api/v1/repos/${CI_REPO}/releases/$${RELEASE_ID}/assets?name=$${ISO}" \
          -H "Authorization: token $${FORGEJO_TOKEN}" \
          -H "Content-Type: multipart/form-data" \
          -F "external_url=$${URL}"
      # add pipeline
      - |
        curl -s -X POST "https://git.anturated.dev/api/v1/repos/${CI_REPO}/releases/$${RELEASE_ID}/assets?name=pipeline" \
          -H "Authorization: token $${FORGEJO_TOKEN}" \
          -H "Content-Type: multipart/form-data" \
          -F "external_url=${CI_PIPELINE_URL}"
