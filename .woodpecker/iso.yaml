when:
  - event: cron
    cron: iso

# TODO: try parallel html connections here and in check... and update

clone:
  - name: clone
    image: woodpeckerci/plugin-git
    settings:
      username: caterpillar-bot
      password:
        from_secret: PILL_TOKEN

steps:
  - name: build
    image: nixos/nix
    commands:
      - |
        export NIX_CONFIG="
          extra-experimental-features = nix-command flakes
          http-connections = 128
          max-substitution-jobs = 128
        "
      - nix build -L .#nixosConfigurations.saeth.config.system.build.isoImage
      # nix store gets nuked
      - cp ./result/iso/*.iso ./

  - name: release
    depends_on: [build]
    image: alpine
    environment:
      FORGEJO_TOKEN:
        from_secret: PILL_TOKEN
    commands:
      # setup
      - apk add curl jq
      - ISO=$(ls *.iso | head -1)
      - SHORT_SHA=$(echo ${CI_COMMIT_SHA} | cut -c1-7)
      # release
      - |
        RELEASE=$(curl -sf -X POST https://git.anturated.dev/api/v1/repos/${CI_REPO}/releases \
          -H "Authorization: token $${FORGEJO_TOKEN}" \
          -H "Content-Type: application/json" \
          -d "{
            \"tag_name\": \"ceirios-$${SHORT_SHA}\",
            \"body\": \"Only 3 isos stay alive at the same time, the rest gets nuked.\",
            \"target_commitish\": \"${CI_COMMIT_SHA}\"
          }")
      # grab id
      - RELEASE_ID=$(echo "$${RELEASE}" | jq -r '.id')
      # add iso
      - |
        curl -sf -X POST "https://git.anturated.dev/api/v1/repos/${CI_REPO}/releases/$${RELEASE_ID}/assets?name=$${ISO}" \
          -H "Authorization: token $${FORGEJO_TOKEN}" \
          -F "attachment=@$${ISO}"
      # add pipeline
      - |
        curl -sf -X POST "https://git.anturated.dev/api/v1/repos/${CI_REPO}/releases/$${RELEASE_ID}/assets?name=pipeline" \
          -H "Authorization: token $${FORGEJO_TOKEN}" \
          -F "external_url=${CI_PIPELINE_URL}"

  - name: cleanup
    depends_on: [release]
    image: alpine
    environment:
      FORGEJO_TOKEN:
        from_secret: PILL_TOKEN
    commands:
      - apk add curl jq
      # keep latest 3 ceirios-* releases, delete the rest
      - |
        curl -sf "https://git.anturated.dev/api/v1/repos/${CI_REPO}/releases?limit=50" \
          -H "Authorization: token $${FORGEJO_TOKEN}" \
          | jq -r '[.[] | select(.tag_name | startswith("ceirios-"))] | sort_by(.created_at) | reverse | .[3:] | .[] | "\(.id) \(.tag_name)"' \
          | while read id tag; do
              echo "deleting release $id ($tag)"
              curl -sf -X DELETE "https://git.anturated.dev/api/v1/repos/${CI_REPO}/releases/$id" \
                -H "Authorization: token $${FORGEJO_TOKEN}"
            done
